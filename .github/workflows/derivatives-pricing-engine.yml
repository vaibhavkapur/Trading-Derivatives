name: Derivatives Pricing Engine CI

on:
  push:
    paths:
      - "derivatives-pricing-engine/**"
  pull_request:
    paths:
      - "derivatives-pricing-engine/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: derivatives-pricing-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit, integration, and boundary tests
        run: PYTHONPATH=src pytest -v

      - name: Run reproducible demo and smoke-check CLI replay
        run: |
          python scripts/run_demo.py
          PYTHONPATH=src python -m derivatives_pricing_engine price \
            --input data/fixtures/valid_european_call.json \
            --output /tmp/ci_envelope.json
          PYTHONPATH=src python -m derivatives_pricing_engine replay \
            --input /tmp/ci_envelope.json
