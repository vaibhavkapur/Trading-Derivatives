name: Fixed Income Analytics Engine CI

on:
  push:
    paths:
      - "fixed-income-analytics-engine/**"
  pull_request:
    paths:
      - "fixed-income-analytics-engine/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixed-income-analytics-engine
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit, integration, and boundary test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run end-to-end demo and acceptance verification
        run: |
          python scripts/run_demo.py
          python scripts/run_acceptance.py

      - name: Verify deterministic CLI replay
        run: |
          PYTHONPATH=src python -m fixed_income replay \
            --fixture data/fixtures/valid_curve_and_bonds.json \
            --baseline reports/demo_output.json
