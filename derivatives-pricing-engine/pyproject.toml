[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "derivatives-pricing-engine"
version = "0.1.0"
description = "Educational and research derivatives pricing engine with Black-Scholes, CRR binomial tree, antithetic Monte Carlo, and finite-difference PDE solvers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<2.3",
    "scipy>=1.10,<1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
]

[project.scripts]
dpe = "derivatives_pricing_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
