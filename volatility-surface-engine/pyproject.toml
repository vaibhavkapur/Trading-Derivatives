[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-surface-engine"
version = "0.1.0"
description = "Arbitrage-aware implied-volatility surface engine with Black-76 IV inversion, SVI/SABR calibration, static arbitrage validation, and versioned snapshots."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<2.3",
    "scipy>=1.10,<1.16",
]

[project.optional-dependencies]
analytics = [
    "polars>=0.20,<2.0",
    "plotly>=5.18,<8.0",
]
dev = [
    "pytest>=7.4,<9.0",
]

[project.scripts]
vse = "volatility_surface_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
